<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>Sprint Foco - Metas & Timer</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <style>
            body {
                -webkit-tap-highlight-color: transparent;
            }
        </style>
    </head>
    <body
        class="bg-slate-900 text-slate-100 min-h-screen pb-20 font-sans antialiased selection:bg-indigo-500 selection:text-white"
    >
        <!-- Header -->
        <header
            class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur border-b border-slate-800 px-5 py-4 flex items-center justify-between"
        >
            <div>
                <h1
                    class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent"
                >
                    Sprint Foco
                </h1>
                <p class="text-xs text-slate-400" id="current-date"></p>
            </div>
            <span
                class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"
            >
                <span
                    class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"
                ></span>
                Meta Ativa
            </span>
        </header>

        <main class="max-w-md mx-auto p-4 space-y-5">
            <!-- Card: Metas da Semana (Esperado vs Realizado) -->
            <section
                class="bg-slate-800/80 rounded-2xl p-4 border border-slate-700 shadow-xl space-y-3"
            >
                <div class="flex items-center justify-between">
                    <div>
                        <h2
                            class="text-xs font-bold uppercase tracking-wider text-indigo-400"
                        >
                            Metas da Semana
                        </h2>
                        <p class="text-[11px] text-slate-400">
                            Tempo Esperado vs. Tempo Realizado
                        </p>
                    </div>
                    <button
                        id="btn-toggle-goals"
                        class="text-xs text-slate-400 hover:text-indigo-300"
                    >
                        <i class="fa-solid fa-sliders"></i> Ajustar Metas
                    </button>
                </div>

                <!-- Formulário rápido para editar metas (escondido por padrão) -->
                <div
                    id="goals-editor"
                    class="hidden bg-slate-900/90 border border-slate-700 rounded-xl p-3 space-y-2 text-xs"
                >
                    <p class="font-semibold text-slate-300">
                        Defina o tempo esperado (em horas):
                    </p>
                    <div
                        class="grid grid-cols-2 gap-2"
                        id="inputs-container"
                    ></div>
                    <button
                        id="btn-save-goals"
                        class="w-full mt-2 py-1.5 rounded bg-indigo-600 font-semibold text-white"
                    >
                        Salvar Metas
                    </button>
                </div>

                <!-- Resumo Geral da Semana -->
                <div
                    class="bg-slate-900/60 rounded-xl p-3 border border-slate-800"
                >
                    <div class="flex justify-between items-baseline mb-1">
                        <span class="text-xs text-slate-300 font-medium"
                            >Progresso Total</span
                        >
                        <span
                            class="text-xs font-mono font-bold"
                            id="total-progress-label"
                            >0h / 0h (0%)</span
                        >
                    </div>
                    <div
                        class="w-full bg-slate-800 rounded-full h-2 overflow-hidden"
                    >
                        <div
                            id="total-progress-bar"
                            class="bg-gradient-to-r from-indigo-500 to-emerald-400 h-2 rounded-full transition-all duration-300"
                            style="width: 0%"
                        ></div>
                    </div>
                </div>

                <!-- Detalhamento por Categoria -->
                <div class="space-y-2.5 pt-1" id="category-progress-list"></div>
            </section>

            <!-- Card: Timer de Execução -->
            <section
                class="bg-slate-800/80 rounded-2xl p-5 border border-slate-700 shadow-xl"
            >
                <div class="flex items-center justify-between mb-3">
                    <label
                        class="text-xs font-semibold text-slate-400 uppercase tracking-wider"
                        >Atividade Selecionada</label
                    >
                    <span
                        id="selected-badge"
                        class="text-xs px-2 py-0.5 rounded font-medium bg-indigo-500/20 text-indigo-300 border border-indigo-500/30"
                        >Pós Alura</span
                    >
                </div>

                <!-- Seletor de Categoria -->
                <div class="grid grid-cols-2 gap-2 mb-4" id="category-picker">
                    <button
                        data-cat="Pós Alura"
                        class="cat-btn active py-2 px-3 rounded-xl text-xs font-semibold border border-indigo-500 bg-indigo-600/30 text-indigo-300"
                    >
                        Pós Alura
                    </button>
                    <button
                        data-cat="Canal Dark"
                        class="cat-btn py-2 px-3 rounded-xl text-xs font-semibold border border-slate-700 bg-slate-800 text-slate-400"
                    >
                        Canal Dark
                    </button>
                    <button
                        data-cat="Mestrado"
                        class="cat-btn py-2 px-3 rounded-xl text-xs font-semibold border border-slate-700 bg-slate-800 text-slate-400"
                    >
                        Mestrado
                    </button>
                    <button
                        data-cat="Academia"
                        class="cat-btn py-2 px-3 rounded-xl text-xs font-semibold border border-slate-700 bg-slate-800 text-slate-400"
                    >
                        Academia
                    </button>
                    <button
                        data-cat="Livro"
                        class="cat-btn py-2 px-3 rounded-xl text-xs font-semibold border border-slate-700 bg-slate-800 text-slate-400 col-span-2"
                    >
                        Leitura do Livro
                    </button>
                </div>

                <!-- Display -->
                <div class="text-center py-3">
                    <div
                        id="timer-display"
                        class="font-mono text-5xl font-bold tracking-tight text-white mb-1"
                    >
                        00:00:00
                    </div>
                    <p class="text-xs text-slate-400" id="timer-state-label">
                        Pronto para iniciar
                    </p>
                </div>

                <!-- Ações -->
                <div class="flex gap-2">
                    <button
                        id="btn-toggle"
                        class="flex-1 py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] transition font-semibold text-sm flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30"
                    >
                        <i class="fa-solid fa-play"></i> Iniciar
                    </button>
                    <button
                        id="btn-finish"
                        disabled
                        class="py-3 px-4 rounded-xl bg-emerald-600/40 text-emerald-300 disabled:opacity-30 disabled:cursor-not-allowed hover:bg-emerald-600 active:scale-[0.98] transition font-semibold text-sm flex items-center justify-center gap-1.5"
                    >
                        <i class="fa-solid fa-check"></i> Concluir
                    </button>
                    <button
                        id="btn-discard"
                        disabled
                        class="py-3 px-3 rounded-xl bg-rose-600/20 text-rose-400 border border-rose-600/30 disabled:opacity-30 disabled:cursor-not-allowed hover:bg-rose-600/30 transition text-sm flex items-center justify-center"
                    >
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            </section>

            <!-- Histórico de Sessões -->
            <section class="space-y-3">
                <div class="flex items-center justify-between">
                    <h2
                        class="text-sm font-semibold uppercase tracking-wider text-slate-400"
                    >
                        Histórico de Atividades
                    </h2>
                    <button
                        id="btn-export"
                        class="text-xs text-indigo-400 hover:text-indigo-300"
                    >
                        Exportar (JSON)
                    </button>
                </div>
                <div id="history-list" class="space-y-2"></div>
            </section>
        </main>

        <script>
            // Configurações padrão de tempo esperado para o sprint (em horas)
            const DEFAULT_TARGETS_HOURS = {
                "Pós Alura": 14, // 14 horas previstas no sprint
                "Canal Dark": 8.5, // 8h30m previstas no sprint
                Mestrado: 2.5, // 2h30m previstas
                Academia: 6, // 1h por dia
                Livro: 4, // 4h a 5h na semana
            };

            const state = {
                activeCategory: "Pós Alura",
                timerRunning: false,
                startTime: null,
                elapsedSeconds: 0,
                interval: null,
                targets: JSON.parse(
                    localStorage.getItem("targets_hours") ||
                        JSON.stringify(DEFAULT_TARGETS_HOURS),
                ),
                sessions: JSON.parse(
                    localStorage.getItem("sessions_tracker") || "[]",
                ),
            };

            // Elementos DOM
            const timerDisplay = document.getElementById("timer-display");
            const timerStateLabel =
                document.getElementById("timer-state-label");
            const btnToggle = document.getElementById("btn-toggle");
            const btnFinish = document.getElementById("btn-finish");
            const btnDiscard = document.getElementById("btn-discard");
            const selectedBadge = document.getElementById("selected-badge");
            const catButtons = document.querySelectorAll(".cat-btn");
            const historyList = document.getElementById("history-list");
            const categoryProgressList = document.getElementById(
                "category-progress-list",
            );
            const totalProgressLabel = document.getElementById(
                "total-progress-label",
            );
            const totalProgressBar =
                document.getElementById("total-progress-bar");
            const currentDate = document.getElementById("current-date");
            const goalsEditor = document.getElementById("goals-editor");
            const btnToggleGoals = document.getElementById("btn-toggle-goals");
            const btnSaveGoals = document.getElementById("btn-save-goals");
            const inputsContainer = document.getElementById("inputs-container");

            currentDate.textContent = new Date().toLocaleDateString("pt-BR", {
                weekday: "long",
                day: "numeric",
                month: "short",
            });

            function formatHoursMinutes(totalSeconds) {
                const h = Math.floor(totalSeconds / 3600);
                const m = Math.floor((totalSeconds % 3600) / 60);
                return `${h}h ${m.toString().padStart(2, "0")}m`;
            }

            function formatTime(totalSeconds) {
                const h = Math.floor(totalSeconds / 3600)
                    .toString()
                    .padStart(2, "0");
                const m = Math.floor((totalSeconds % 3600) / 60)
                    .toString()
                    .padStart(2, "0");
                const s = (totalSeconds % 60).toString().padStart(2, "0");
                return `${h}:${m}:${s}`;
            }

            // Seletor de Categoria
            catButtons.forEach((btn) => {
                btn.addEventListener("click", () => {
                    if (state.timerRunning) return;
                    catButtons.forEach((b) => {
                        b.className =
                            "cat-btn py-2 px-3 rounded-xl text-xs font-semibold border border-slate-700 bg-slate-800 text-slate-400";
                    });
                    btn.className =
                        "cat-btn py-2 px-3 rounded-xl text-xs font-semibold border border-indigo-500 bg-indigo-600/30 text-indigo-300";
                    state.activeCategory = btn.dataset.cat;
                    selectedBadge.textContent = state.activeCategory;
                });
            });

            // Lógica do Timer
            function updateTimer() {
                state.elapsedSeconds++;
                timerDisplay.textContent = formatTime(state.elapsedSeconds);
            }

            btnToggle.addEventListener("click", () => {
                if (!state.timerRunning) {
                    state.timerRunning = true;
                    state.startTime = new Date().toISOString();
                    state.interval = setInterval(updateTimer, 1000);
                    btnToggle.innerHTML =
                        '<i class="fa-solid fa-pause"></i> Pausar';
                    btnToggle.className =
                        "flex-1 py-3 px-4 rounded-xl bg-amber-600 hover:bg-amber-500 transition font-semibold text-sm flex items-center justify-center gap-2";
                    timerStateLabel.textContent = `Em andamento: ${state.activeCategory}`;
                    btnFinish.disabled = false;
                    btnDiscard.disabled = false;
                } else {
                    state.timerRunning = false;
                    clearInterval(state.interval);
                    btnToggle.innerHTML =
                        '<i class="fa-solid fa-play"></i> Continuar';
                    btnToggle.className =
                        "flex-1 py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 transition font-semibold text-sm flex items-center justify-center gap-2";
                    timerStateLabel.textContent = "Pausado";
                }
            });

            btnDiscard.addEventListener("click", () => {
                if (confirm("Deseja descartar este tempo?")) {
                    resetTimer();
                }
            });

            btnFinish.addEventListener("click", () => {
                if (state.elapsedSeconds < 30) {
                    alert("Sessão muito curta (mínimo 30 segundos).");
                    return;
                }

                const session = {
                    id: Date.now(),
                    category: state.activeCategory,
                    seconds: state.elapsedSeconds,
                    timestamp: state.startTime || new Date().toISOString(),
                    dateStr: new Date().toLocaleDateString("pt-BR"),
                    timeStr: new Date().toLocaleTimeString("pt-BR", {
                        hour: "2-digit",
                        minute: "2-digit",
                    }),
                };

                state.sessions.unshift(session);
                localStorage.setItem(
                    "sessions_tracker",
                    JSON.stringify(state.sessions),
                );
                resetTimer();
                renderAll();
            });

            function resetTimer() {
                state.timerRunning = false;
                clearInterval(state.interval);
                state.elapsedSeconds = 0;
                state.startTime = null;
                timerDisplay.textContent = "00:00:00";
                timerStateLabel.textContent = "Pronto para iniciar";
                btnToggle.innerHTML =
                    '<i class="fa-solid fa-play"></i> Iniciar';
                btnToggle.className =
                    "flex-1 py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 transition font-semibold text-sm flex items-center justify-center gap-2";
                btnFinish.disabled = true;
                btnDiscard.disabled = true;
            }

            // Configuração e Edição de Metas
            btnToggleGoals.addEventListener("click", () => {
                goalsEditor.classList.toggle("hidden");
                if (!goalsEditor.classList.contains("hidden")) {
                    inputsContainer.innerHTML = "";
                    Object.keys(state.targets).forEach((cat) => {
                        inputsContainer.innerHTML += `
            <div>
              <label class="block text-slate-400 mb-0.5">${cat}</label>
              <input type="number" step="0.5" min="0" data-cat="${cat}" value="${state.targets[cat]}" class="goal-input w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-slate-200">
            </div>
          `;
                    });
                }
            });

            btnSaveGoals.addEventListener("click", () => {
                document.querySelectorAll(".goal-input").forEach((input) => {
                    state.targets[input.dataset.cat] =
                        parseFloat(input.value) || 0;
                });
                localStorage.setItem(
                    "targets_hours",
                    JSON.stringify(state.targets),
                );
                goalsEditor.classList.add("hidden");
                renderAll();
            });

            // Renderização do Progresso e Histórico
            function renderAll() {
                const now = new Date();
                const oneWeekAgo = new Date(
                    now.getTime() - 7 * 24 * 60 * 60 * 1000,
                );

                const realTotals = {
                    "Pós Alura": 0,
                    "Canal Dark": 0,
                    Mestrado: 0,
                    Academia: 0,
                    Livro: 0,
                };
                let totalRealSeconds = 0;

                state.sessions.forEach((s) => {
                    const d = new Date(s.timestamp);
                    if (d >= oneWeekAgo) {
                        totalRealSeconds += s.seconds;
                        if (realTotals[s.category] !== undefined) {
                            realTotals[s.category] += s.seconds;
                        }
                    }
                });

                // Cálculo das Metas Totais
                let totalExpectedSeconds = 0;
                Object.keys(state.targets).forEach((cat) => {
                    totalExpectedSeconds += (state.targets[cat] || 0) * 3600;
                });

                const totalPercent =
                    totalExpectedSeconds > 0
                        ? Math.min(
                              100,
                              Math.round(
                                  (totalRealSeconds / totalExpectedSeconds) *
                                      100,
                              ),
                          )
                        : 0;
                totalProgressLabel.textContent = `${formatHoursMinutes(totalRealSeconds)} / ${formatHoursMinutes(totalExpectedSeconds)} (${totalPercent}%)`;
                totalProgressBar.style.width = `${totalPercent}%`;

                // Render Categorias
                categoryProgressList.innerHTML = "";
                Object.keys(state.targets).forEach((cat) => {
                    const realSec = realTotals[cat] || 0;
                    const targetSec = (state.targets[cat] || 0) * 3600;
                    const pct =
                        targetSec > 0
                            ? Math.min(
                                  100,
                                  Math.round((realSec / targetSec) * 100),
                              )
                            : 0;
                    const isDone = realSec >= targetSec && targetSec > 0;

                    categoryProgressList.innerHTML += `
          <div class="text-xs">
            <div class="flex justify-between items-center mb-1">
              <span class="font-medium ${isDone ? "text-emerald-400 font-semibold" : "text-slate-300"}">
                ${isDone ? '<i class="fa-solid fa-circle-check text-[11px] mr-1"></i>' : ""}${cat}
              </span>
              <div class="font-mono text-[11px]">
                <span class="${isDone ? "text-emerald-400" : "text-white"} font-bold">${formatHoursMinutes(realSec)}</span>
                <span class="text-slate-500"> / esperado: ${formatHoursMinutes(targetSec)}</span>
              </div>
            </div>
            <div class="w-full bg-slate-900 rounded-full h-1.5 overflow-hidden">
              <div class="${isDone ? "bg-emerald-400" : "bg-indigo-500"} h-1.5 rounded-full transition-all duration-300" style="width: ${pct}%"></div>
            </div>
          </div>
        `;
                });

                // Render Histórico
                historyList.innerHTML = "";
                if (state.sessions.length === 0) {
                    historyList.innerHTML =
                        '<p class="text-xs text-slate-500 text-center py-4">Nenhum registro ainda. Inicie um bloco no timer!</p>';
                    return;
                }

                state.sessions.slice(0, 10).forEach((s) => {
                    const item = document.createElement("div");
                    item.className =
                        "bg-slate-800/60 border border-slate-700/60 rounded-xl p-3 flex items-center justify-between";
                    item.innerHTML = `
          <div>
            <div class="flex items-center gap-2">
              <span class="text-xs font-semibold text-slate-200">${s.category}</span>
              <span class="text-[10px] text-slate-400 font-mono">${s.dateStr} às ${s.timeStr}</span>
            </div>
            <p class="text-xs font-mono font-medium text-emerald-400 mt-0.5">${formatHoursMinutes(s.seconds)} executados</p>
          </div>
          <button onclick="deleteSession(${s.id})" class="text-slate-500 hover:text-rose-400 p-2 transition">
            <i class="fa-solid fa-xmark text-xs"></i>
          </button>
        `;
                    historyList.appendChild(item);
                });
            }

            window.deleteSession = function (id) {
                if (confirm("Excluir este registro?")) {
                    state.sessions = state.sessions.filter((s) => s.id !== id);
                    localStorage.setItem(
                        "sessions_tracker",
                        JSON.stringify(state.sessions),
                    );
                    renderAll();
                }
            };

            document
                .getElementById("btn-export")
                .addEventListener("click", () => {
                    const blob = new Blob(
                        [JSON.stringify(state.sessions, null, 2)],
                        { type: "application/json" },
                    );
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = `sprint-foco-${new Date().toISOString().slice(0, 10)}.json`;
                    a.click();
                });

            renderAll();
        </script>
    </body>
</html>
